name: Deploy Shiny App to shinyapps.io

# Trigger conditions: deploy automatically on push to main branch, or manually
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Minimal required permissions for the workflow
permissions:
  contents: read

jobs:
  deploy:
    # Use Ubuntu runner (compatible with R and ShinyApps deployment)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull your repository code (including app.R, model_save.rds, etc.)
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Set up R environment matching your local version
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      # Step 3: Install system-level dependencies required for R packages
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev

      # Step 4: Install all R packages required for your aging analysis app
      - name: Install required R packages
        run: |
          install.packages(c(
            'rsconnect',       # Deployment package for shinyapps.io
            'shiny',           # Core Shiny framework
            'bslib',           # UI themes
            'fontawesome',     # Icons
            'plm',             # Panel data models
            'lmtest',          # Coefficient tests
            'sandwich',        # Robust standard errors
            'dplyr',           # Data manipulation
            'ggplot2',         # Visualization
            'purrr',           # Functional programming
            'stringr'          # String handling
          ), repos = "https://cran.rstudio.com/")
        shell: Rscript {0}

      # Step 5: Deploy to shinyapps.io using encrypted secrets
      - name: Deploy app to shinyapps.io
        env:
          SHINY_ACC_NAME: ${{ secrets.SHINY_ACC_NAME }}
          SHINY_TOKEN: ${{ secrets.SHINY_TOKEN }}
          SHINY_SECRET: ${{ secrets.SHINY_SECRET }}
        run: Rscript deploy.R
